services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatstore
      POSTGRES_PASSWORD: whatstore
      POSTGRES_DB: whatstore
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    depends_on: [db]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://whatstore:whatstore@db:5432/whatstore
      JWT_SECRET: change-me-long-random-string
      PUBLIC_URL: http://localhost:3000
      ALLOW_MOCK_PAYMENTS: "true"   # retire en production réelle
    volumes: [uploads:/app/uploads]
volumes:
  pgdata:
  uploads:
